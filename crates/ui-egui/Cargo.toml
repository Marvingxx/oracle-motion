[package]
name = "oracle-motion-ui-egui"
description = "The Oracle Motion egui frontend (swappable): docking panels, composition viewer, timeline, effect controls, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
oracle-motion-time = { workspace = true }
oracle-motion-geom = { workspace = true }
oracle-motion-color = { workspace = true }
oracle-motion-keyframe = { workspace = true }
oracle-motion-project = { workspace = true }
oracle-motion-path = { workspace = true }
oracle-motion-text = { workspace = true }
oracle-motion-render = { workspace = true }
oracle-motion-engine = { workspace = true }
oracle-motion-gpu = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sys-locale = { workspace = true }
# The Oracle suite: the library window, and the other apps (oracle_suite.rs).
oracle-library-ui = { path = "../../../oracle-library/ui" }
oracle-suite-link = { path = "../../../oracle-library/link" }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
pollster = "0.4"
oracle-motion-host = { workspace = true }
exr = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
