[package]
name = "oracle-motion-render"
description = "The CPU compositor: property evaluation, layer sources (solids, footage, text, shapes, precomps), masks, effects, track mattes, 2D/3D transforms, motion blur and blending"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oracle-motion-time = { workspace = true }
oracle-motion-geom = { workspace = true }
oracle-motion-color = { workspace = true }
oracle-motion-keyframe = { workspace = true }
oracle-motion-project = { workspace = true }
oracle-motion-raster = { workspace = true }
oracle-motion-path = { workspace = true }
oracle-motion-text = { workspace = true }
oracle-motion-effects = { workspace = true }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
oracle-motion-model = { workspace = true }
kurbo = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
