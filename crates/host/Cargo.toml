[package]
name = "oracle-motion-host"
description = "Builds a fully wired Oracle Motion session: media decoding (FilmCraft codecs), importer, the expression engine and scripting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
oracle-motion-engine = { workspace = true }
oracle-motion-project = { workspace = true }
log = { workspace = true }
oracle-motion-media = { workspace = true }
oracle-motion-expr = { workspace = true }
oracle-motion-script = { workspace = true }
oracle-motion-export = { workspace = true }
oracle-motion-plugin = { workspace = true }

# WebAssembly effect plug-ins run in wasmi on native builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oracle-motion-plugin = { workspace = true, features = ["wasm"] }

[dev-dependencies]
oracle-suite-link = { path = "../../../oracle-library/link" }
serde_json = { workspace = true }
oracle-motion-psd = { workspace = true }
oracle-motion-svg = { workspace = true }
oracle-motion-pdf = { workspace = true }
oracle-motion-raster = { workspace = true }
oracle-motion-time = { workspace = true }
oracle-motion-interchange = { workspace = true }
image = { workspace = true }
gif = { workspace = true }
exr = { workspace = true }
rayon = { workspace = true }
